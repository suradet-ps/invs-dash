[package]
name = "invs-dash"
version = "0.1.0"
description = "INVS Dash — คลังยา โรงพยาบาลสระโบสถ์"
authors = ["Suradet Pratomsak"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.94.1"

[lib]
name = "invs_dash_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "invs-dash"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiberius = { version = "0.12", default-features = false, features = ["tokio", "rustls", "sql-browser-tokio"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
once_cell = "1"
futures = "0.3"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
